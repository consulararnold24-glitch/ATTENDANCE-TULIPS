<style>
/* Layout: one shared page. Phone = monitor roll call (tap a name). Laptop = teacher register (SF2-style month grid). */
:root{
  --bg:#F8F2F7; --surface:#FFFFFF; --surface2:#F3E9F1; --ink:#2A1722; --muted:#7B6672; --line:#E7D7E1;
  --accent:#A8236B; --on-accent:#FFFFFF; --leaf:#2F8A57;
  --A:#D9482B; --E:#2E6BD6; --C:#B87C00; --L:#12857F; --P:#2F8A57;
  --t1:#C2307A; --t2:#E2543F; --t3:#F2B01E; --t4:#8E3FA0; --t5:#F27AA9;
  --wk:#F1E6EE; --shadow:0 10px 30px rgba(60,20,45,.18);
  --f-display:'Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --f-body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --gutter:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1219; --surface:#271A23; --surface2:#322230; --ink:#F7E8F0; --muted:#BBA2B0; --line:#40303B;
    --accent:#F06AB0; --on-accent:#2A0F1D; --leaf:#5FCB8C;
    --A:#FF7A5C; --E:#6EA4FF; --C:#F0B73A; --L:#4CCFC6; --P:#5FCB8C;
    --t1:#F06AB0; --t2:#FF7A5C; --t3:#F7C948; --t4:#B77BE0; --t5:#FF9FC4;
    --wk:#2D1F29; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1219; --surface:#271A23; --surface2:#322230; --ink:#F7E8F0; --muted:#BBA2B0; --line:#40303B;
  --accent:#F06AB0; --on-accent:#2A0F1D; --leaf:#5FCB8C;
  --A:#FF7A5C; --E:#6EA4FF; --C:#F0B73A; --L:#4CCFC6; --P:#5FCB8C;
  --t1:#F06AB0; --t2:#FF7A5C; --t3:#F7C948; --t4:#B77BE0; --t5:#FF9FC4;
  --wk:#2D1F29; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:12px 28px;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.tp-svg{display:block}

/* tulip symbol parts */
.ts{fill:none;stroke:var(--leaf);stroke-width:2;stroke-linecap:round}
.tl{fill:var(--leaf)}
.tp{fill:currentColor;opacity:.78}
.tc{fill:currentColor;stroke:#fff;stroke-opacity:.55;stroke-width:.8}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:34px;height:46px;color:var(--accent);flex:none}
.brand h1{font-size:24px;line-height:1.05}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.modes{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;min-height:40px}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.garden{display:flex;justify-content:space-between;align-items:flex-end;height:46px;overflow:hidden;border-bottom:2px solid var(--leaf);gap:4px;margin-top:-2px}
.garden svg{flex:none}

/* banners */
.note{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{border-color:var(--C);background:color-mix(in srgb,var(--C) 12%,var(--surface))}
.note.info{border-color:var(--E);background:color-mix(in srgb,var(--E) 10%,var(--surface))}
.note b{font-weight:700}

/* date bar */
.datebar{display:flex;flex-direction:column;gap:10px}
.dnav{display:flex;align-items:center;gap:10px}
.dtitle{flex:1;text-align:center;min-width:0}
.dtitle strong{font-family:var(--f-display);font-size:22px;display:block;line-height:1.15}
.dtitle span{color:var(--muted);font-size:13px}
.ib{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;max-width:100%}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 4px;min-height:40px}
.strip{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.dchip{flex:none;width:46px;padding:6px 0 7px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:1px;scroll-snap-align:center;position:relative}
.dchip small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.dchip b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.dchip.wk{background:var(--wk)}
.dchip.today{border-color:var(--accent)}
.dchip[aria-current="date"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dchip[aria-current="date"] small{color:inherit;opacity:.85}
.dchip i{width:6px;height:6px;border-radius:50%;background:var(--leaf);position:absolute;bottom:3px}
.dchip.nc i{background:var(--muted)}
.dchip[aria-current="date"] i{background:var(--on-accent)}

/* summary pills */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.pill b{font-variant-numeric:tabular-nums;font-size:15px}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc,var(--P))}

/* tiles */
.group h2{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.group h2 span{font-family:var(--f-body);font-weight:600;font-size:13px;letter-spacing:0;text-transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;min-height:66px;padding:9px 12px;
  border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;--sc:var(--P)}
.tile .ic{width:24px;height:33px;color:var(--accent);transition:transform .2s}
.tile .nm{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.tile .nm b{font-weight:700;overflow-wrap:anywhere}
.tile .nm span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.tile .state{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px}
.tile .chip{background:var(--sc);color:#fff;border-radius:999px;padding:2px 9px;font-weight:700;font-size:12px}
:root[data-theme="dark"] .tile .chip{color:#1b0f17}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile .chip{color:#1b0f17}}
.tile .why{color:var(--ink);overflow-wrap:anywhere}
.tile:not([data-st="P"]){border-color:var(--sc);background:color-mix(in srgb,var(--sc) 11%,var(--surface))}
.tile:not([data-st="P"]) .ic{color:var(--sc);transform:rotate(-26deg) translateY(2px)}
.tile[data-st="A"]{--sc:var(--A)} .tile[data-st="E"]{--sc:var(--E)} .tile[data-st="C"]{--sc:var(--C)} .tile[data-st="L"]{--sc:var(--L)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile:active{transform:scale(.985)}

/* save bar */
.savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(8px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--on-accent);min-height:48px}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:var(--accent);padding-inline:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.savebar .grow{flex:1;min-width:200px}
.saved{display:flex;align-items:center;gap:8px;color:var(--P);font-weight:700}
.saved svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* teacher */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.stat small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.attn{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.attn .tag{background:color-mix(in srgb,var(--A) 13%,var(--surface));border:1.5px solid var(--A);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.attn .tag.watch{border-color:var(--C);background:color-mix(in srgb,var(--C) 12%,var(--surface))}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:19px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.reg-wrap{overflow:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);max-height:78vh}
table.reg{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.reg th,.reg td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;background:var(--surface)}
.reg thead th{position:sticky;top:0;z-index:3;background:var(--surface2)}
.reg .c-no,.reg .c-name{position:sticky;z-index:2;text-align:left}
.reg .c-no{left:0;width:38px;min-width:38px;padding:0 6px;color:var(--muted);font-variant-numeric:tabular-nums}
.reg .c-name{left:38px;min-width:210px;padding:0 10px;white-space:nowrap;box-shadow:2px 0 0 var(--line)}
.reg thead .c-no,.reg thead .c-name{z-index:4}
.reg td.wk,.reg th.wk{background:var(--wk)}
.reg td.off{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--muted) 14%,transparent) 4px 5px)}
.dhb{width:32px;display:flex;flex-direction:column;align-items:center;padding:4px 0;border:0;background:none;line-height:1.1;margin:auto}
.dhb span{font-size:10.5px;color:var(--muted);font-weight:700}
.dhb b{font-variant-numeric:tabular-nums}
.cell{width:32px;height:32px;display:grid;place-items:center;border:0;background:none;margin:auto;border-radius:6px}
.cell:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.g{font-style:normal;font-weight:800;font-size:14px;line-height:1}
.gA{color:var(--A)} .gE{color:var(--E)}
.gP{width:4px;height:4px;border-radius:50%;background:var(--line);display:block}
.gC,.gL{width:15px;height:15px;border:1.5px solid var(--ink);display:block;border-radius:2px}
.gC{background:linear-gradient(to bottom,transparent 50%,var(--C) 50%)}
.gL{background:linear-gradient(to bottom,var(--L) 50%,transparent 50%)}
.legend .g{display:inline-block}
.reg .tot{min-width:50px;font-variant-numeric:tabular-nums;font-weight:700;padding:0 6px}
.reg thead .tot{font-size:12px}
.reg tr.sum td,.reg tr.sum th{background:var(--surface2);font-weight:700;font-variant-numeric:tabular-nums}
.reg tr.sum .c-name,.reg tr.sum .c-no{background:var(--surface2)}
.reg tr.grp th{background:var(--surface2);text-align:left;padding:5px 10px;position:sticky;left:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reg tbody tr:not(.sum):not(.grp) td:not(.c-no):not(.c-name):not(.tot){height:34px}
.reg .nm{display:block;padding:7px 0}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 24px}
.rrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.rrow code{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--muted)}
.rrow em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.regsec{display:flex;flex-direction:column;gap:10px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:46px;color:var(--accent);margin:0 auto 6px;display:block}
.foot{color:var(--muted);font-size:12.5px;margin-top:6px}

/* sheet */
#sheetRoot[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(20,6,14,.55);z-index:20}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--ink);
  border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding:10px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-width:560px;margin-inline:auto}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sh-head{display:flex;gap:12px;align-items:center}
.sh-head .ic{width:28px;height:38px;color:var(--accent);flex:none}
.sh-head h2{font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.sh-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sh-head .x{margin-left:auto;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center}
.sh-head .x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;display:block}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;border:0;padding:0;margin:0}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;font-weight:700;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;--sc:var(--A)}
.seg button[data-st="E"]{--sc:var(--E)} .seg button[data-st="C"]{--sc:var(--C)} .seg button[data-st="L"]{--sc:var(--L)}
.seg button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sc)}
.seg button[aria-pressed="true"]{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 16%,var(--surface))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rc{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:42px}
.rc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sh-actions{display:flex;gap:10px;flex-wrap:wrap}
.sh-actions .btn{flex:1;min-width:130px}
.tgl{display:flex;gap:12px;align-items:center;font-weight:600;min-height:44px}
.tgl input{width:22px;height:22px;accent-color:var(--accent)}
@media (min-width:640px){
  .sheet{top:50%;bottom:auto;transform:translateY(-50%);border-radius:22px;left:0;right:0;max-height:90%}
  .seg{grid-template-columns:repeat(4,1fr)}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#toast[hidden]{display:none}

/* mode switching: monitor shows tiles, teacher shows register */
@media (max-width:420px){ .brand h1{font-size:21px} .modes button{padding:8px 11px} }
.backup{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.backup h2{font-size:17px}
.backup .foot{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- dates ---------- */
var START='2026-01-01', END='2027-12-31';
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAYN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var D3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var SF=['S','M','T','W','TH','F','S'];
function pad(n){return (n<10?'0':'')+n;}
function ymd(y,m,d){return y+'-'+pad(m)+'-'+pad(d);}
function parse(s){var a=s.split('-');return {y:+a[0],m:+a[1],d:+a[2]};}
function dow(s){var p=parse(s);return new Date(p.y,p.m-1,p.d).getDay();}
function dim(y,m){return new Date(y,m,0).getDate();}
function addDays(s,n){var p=parse(s);var d=new Date(p.y,p.m-1,p.d+n);return ymd(d.getFullYear(),d.getMonth()+1,d.getDate());}
function clamp(s){return s<START?START:(s>END?END:s);}
function todayStr(){var d=new Date();return clamp(ymd(d.getFullYear(),d.getMonth()+1,d.getDate()));}
function isWeekend(s){var w=dow(s);return w===0||w===6;}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function longDate(s){var p=parse(s);return DAYN[dow(s)]+', '+MONTHS[p.m-1]+' '+p.d+', '+p.y;}
function shortDate(s){var p=parse(s);return D3[dow(s)]+', '+MONTHS[p.m-1].slice(0,3)+' '+p.d;}

/* ---------- state ---------- */
var S={mode:'monitor',date:todayStr(),days:{},loading:true,offline:false,canWrite:true,canDownload:true,sheet:null};
var db=null;
/* ---------- storage: this device only, no sign-in, no internet ---------- */
var STORE_KEY='tulip-attendance-v1', BACKUP_KEY='tulip-last-backup';
function loadStore(){
  try{
    localStorage.setItem('tulip-test','1'); localStorage.removeItem('tulip-test');
    var t=localStorage.getItem(STORE_KEY); if(!t) return {};
    var o=JSON.parse(t); return (o&&o.days&&typeof o.days==='object')?o.days:{};
  }catch(e){S.offline=true;return {};}
}
function persist(){
  if(db) return true;
  try{localStorage.setItem(STORE_KEY,JSON.stringify({v:1,saved:Date.now(),days:S.days}));return true;}
  catch(e){S.offline=true;toast('This device would not keep the attendance. Download a backup now.');return false;}
}
var dl={save:function(o){return new Promise(function(res,rej){
  try{
    var type=/\.csv$/.test(o.filename)?'text/csv;charset=utf-8':(/\.json$/.test(o.filename)?'application/json':'text/html;charset=utf-8');
    var url=URL.createObjectURL(new Blob([o.data],{type:type}));
    var a=document.createElement('a'); a.href=url; a.download=o.filename; a.style.display='none'; document.body.appendChild(a); a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},2000); res();
  }catch(e){rej(e);}
});}};
try{var saved=localStorage.getItem('tulip-mode'); if(saved==='teacher'||saved==='monitor'){S.mode=saved;} else {S.mode=window.innerWidth>=820?'teacher':'monitor';}}catch(e){S.mode=window.innerWidth>=820?'teacher':'monitor';}

/* ---------- data helpers ---------- */
function dayDoc(date){return S.days[date]||null;}
function markOf(date,sid){var d=S.days[date];return d&&d.marks&&d.marks[sid]?d.marks[sid]:null;}
function stOf(date,sid){var m=markOf(date,sid);return m&&m.st?m.st:'P';}
function isAbs(st){return st==='A'||st==='E';}
function isRecorded(date){
  var d=S.days[date]; if(!d||d.noClass) return false;
  if(d.taken) return true;
  var mk=d.marks||{}; for(var k in mk){ if(BY_ID[k]&&mk[k].st&&mk[k].st!=='P') return true; }
  return false;
}
function dayCounts(date){
  var c={A:0,E:0,C:0,L:0}, d=S.days[date]; if(!d||!d.marks) return c;
  for(var k in d.marks){ if(BY_ID[k]&&c[d.marks[k].st]!==undefined) c[d.marks[k].st]++; }
  return c;
}
function reasonText(m){
  if(!m||m.st==='P') return '';
  var r=R_BY[m.reason], note=(m.note||'').trim();
  if(r&&r.id==='other') return note||r.label.replace(/ \(.*\)/,'');
  if(r) return r.label+(note?' · '+note:'');
  return note;
}

/* ---------- writes ---------- */
var queues={};
function writeDay(date,patch){
  if(!S.canWrite){toast('This link is view-only. Ask the teacher for edit access.');return Promise.resolve();}
  applyLocal(date,patch); if(!db){ persist(); render(); return Promise.resolve(); } render();
  var run=function(){
    var ref=db.collection('days').doc(date);
    return ref.get().then(function(snap){
      if(snap.exists) return ref.update(patch);
      var base={date:date,taken:false,noClass:false,noClassLabel:'',marks:{}};
      var doc=Object.assign(base,patch); doc.marks=Object.assign({},patch.marks||{});
      return ref.set(doc);
    });
  };
  queues[date]=(queues[date]||Promise.resolve()).then(run).catch(function(err){
    console.error(err); toast('Could not save. Check the connection and try again.');
  });
  return queues[date];
}
function pushDay(date,doc){
  if(!db||!S.canWrite) return;
  queues[date]=(queues[date]||Promise.resolve()).then(function(){return db.collection('days').doc(date).set(doc);}).catch(function(err){console.error(err);toast('Could not save one restored day.');});
}
var pendingRender=false;
function softRender(){var a=document.activeElement; if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable)){pendingRender=true;return;} render();}
document.addEventListener('focusout',function(){if(pendingRender){pendingRender=false;setTimeout(softRender,0);}});
function applyLocal(date,patch){
  var cur=S.days[date]||{date:date,taken:false,noClass:false,noClassLabel:'',marks:{}};
  var next=Object.assign({},cur,patch);
  next.marks=Object.assign({},cur.marks||{});
  if(patch.marks){for(var k in patch.marks){next.marks[k]=patch.marks[k];}}
  S.days=Object.assign({},S.days); S.days[date]=next;
}

/* ---------- stats ---------- */
function monthDates(y,m){var a=[],n=dim(y,m);for(var d=1;d<=n;d++)a.push(ymd(y,m,d));return a;}
function monthStats(y,m){
  var dates=monthDates(y,m), rec=dates.filter(isRecorded);
  var per={}; ROSTER.forEach(function(s){per[s.id]={abs:0,tardy:0,run:0,maxRun:0};});
  var perDay={}, reasonCount={}, noReason=0, totalPresent=0;
  rec.forEach(function(date){
    var pm=0,pf=0;
    ROSTER.forEach(function(s){
      var mk=markOf(date,s.id), st=mk&&mk.st?mk.st:'P', p=per[s.id];
      if(isAbs(st)){p.abs++;p.run++;if(p.run>p.maxRun)p.maxRun=p.run;}
      else{p.run=0;if(s.sex==='M')pm++;else pf++;if(st==='C'||st==='L')p.tardy++;}
      if(st!=='P'){ if(mk.reason&&R_BY[mk.reason]) reasonCount[mk.reason]=(reasonCount[mk.reason]||0)+1; else noReason++; }
    });
    perDay[date]={M:pm,F:pf}; totalPresent+=pm+pf;
  });
  var n=rec.length, ada=n?totalPresent/n:null;
  return {dates:dates,rec:rec,per:per,perDay:perDay,reasons:reasonCount,noReason:noReason,days:n,ada:ada,pct:n?ada/ROSTER.length*100:null};
}

var CHEV_L='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
var CHEV_R='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

function monthSelect(){
  var cur=S.date.slice(0,7), o='';
  for(var y=2026;y<=2027;y++)for(var m=1;m<=12;m++){var v=y+'-'+pad(m);o+='<option value="'+v+'"'+(v===cur?' selected':'')+'>'+MONTHS[m-1]+' '+y+'</option>';}
  return '<label class="sr" for="monthSel">Month</label><select id="monthSel">'+o+'</select>';
}

function backupCard(){
  var n=Object.keys(S.days).length, lb=0; try{lb=+localStorage.getItem(BACKUP_KEY)||0;}catch(e){}
  var stale=n>0&&(!lb||(Date.now()-lb)>7*864e5);
  var when=lb?new Date(lb).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'}):'never';
  return '<section class="backup" aria-label="Backup and share"><h2>Backup and share</h2>'+
    '<p class="foot">'+(db?'Attendance is saved online and shared live: what the monitor marks, the teacher sees on their own device. A backup file is an extra safe copy.':'Attendance is saved on this device, in this browser. No internet or sign-in is needed. A backup file keeps a safe copy and lets you move records between the monitor\'s phone and the teacher\'s laptop (send the file by Messenger, Bluetooth, USB or email).')+'</p>'+
    (stale?'<div class="note warn"><span><b>'+(lb?'No backup in over a week.':'No backup yet.')+'</b> Download one so the records are safe if the phone is reset or the browser data is cleared.</span></div>':'')+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-act="backup">Download backup</button><button type="button" class="btn sec" data-act="restore">Restore from backup file</button></div>'+
    '<p class="foot">Last backup: '+when+'. Restoring adds the file to what is already here and never deletes; if the same learner and day are in both, the file wins.</p></section>';
}

function tile(s,date,disabled){
  var m=markOf(date,s.id), st=m&&m.st?m.st:'P', why=reasonText(m);
  return '<button type="button" class="tile" data-act="open" data-sid="'+s.id+'" data-st="'+st+'"'+(disabled?' disabled':'')+'>'+
    '<svg class="ic" viewBox="0 0 32 44" aria-hidden="true"><use href="#tulip"/></svg>'+
    '<span class="nm"><b>'+esc(s.last)+'</b><span>'+esc(s.short)+'</span></span>'+
    (st!=='P'?'<span class="state"><span class="chip">'+ST[st]+'</span>'+(why?'<span class="why">'+esc(why)+'</span>':'')+'</span>':'')+
  '</button>';
}

function glyph(st,rec){
  if(st==='A') return '<i class="g gA">x</i>';
  if(st==='E') return '<i class="g gE">E</i>';
  if(st==='C') return '<i class="g gC"></i>';
  if(st==='L') return '<i class="g gL"></i>';
  return rec?'<i class="gP"></i>':'';
}

  var rk=Object.keys(ms.reasons).sort(function(a,b){return ms.reasons[b]-ms.reasons[a];});
  var rr=rk.map(function(k){var r=R_BY[k];return '<div class="rrow"><code>'+(r.sf2||'—')+'</code><span>'+esc(r.label)+'</span><em>'+ms.reasons[k]+'</em></div>';}).join('');
  if(ms.noReason) rr+='<div class="rrow"><code>—</code><span>No reason recorded</span><em>'+ms.noReason+'</em></div>';
  var reasons=rr?'<section><div class="sec-h"><h2>Reasons this month</h2><span class="foot" style="margin:0">Count of absent, excused, cutting and late marks, by SF2 reason code</span></div><div class="reasons">'+rr+'</div></section>':'';

  var dlBtn='<div style="display:flex;gap:8px;flex-wrap:wrap">'+(S.canDownload?'<button type="button" class="btn sec" data-act="csv">Download month (CSV)</button>':'')+'<button type="button" class="btn" data-act="sf2">SF2 for printing</button></div>';
  return head+notes+stats+attn+empty+
    '<section class="regsec"><div class="sec-h"><h2>'+MONTHS[m-1]+' '+y+' register</h2>'+dlBtn+'</div>'+legend+table+'</section>'+reasons+backupCard();
}

/* ---------- render ---------- */
var lastCentered='';
function render(){
  document.querySelectorAll('[data-act="mode"]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.mode===S.mode?'true':'false');});
  var scrollY=window.scrollY;
  var keep=document.querySelector('.reg-wrap'); var rx=keep?keep.scrollLeft:0, ry=keep?keep.scrollTop:0;
  $app.innerHTML=S.mode==='monitor'?monitorHTML():teacherHTML();
  var reg=document.querySelector('.reg-wrap'); if(reg){reg.scrollLeft=rx;reg.scrollTop=ry;}
  var strip=document.getElementById('strip');
  if(strip){
    var cur=strip.querySelector('[aria-current="date"]');
    var tag=S.date;
    if(cur&&(lastCentered!==tag)){strip.scrollLeft=cur.offsetLeft-strip.clientWidth/2+cur.offsetWidth/2;lastCentered=tag;}
    else if(window._stripX!=null){strip.scrollLeft=window._stripX;}
  }
  window.scrollTo(0,scrollY);
}

/* ---------- sheet ---------- */
function openCell(sid,date){
  var m=markOf(date,sid), had=!!(m&&m.st&&m.st!=='P');
  S.sheet={type:'cell',sid:sid,date:date,had:had,st:had?m.st:'A',reason:had?(m.reason||''):'',note:had?(m.note||''):'',more:false};
  drawSheet();
}
function openDay(date){
  var d=dayDoc(date)||{};
  S.sheet={type:'day',date:date,noClass:!!d.noClass,label:d.noClassLabel||'',taken:!!d.taken};
  drawSheet();
}
function closeSheet(){S.sheet=null;$sheet.hidden=true;$sheet.innerHTML='';}
function drawSheet(){
  var sh=S.sheet; if(!sh){return;}
  var html;
  if(sh.type==='cell'){
    var s=BY_ID[sh.sid];
    var prim=PRIMARY[sh.st]||[], teacher=S.mode==='teacher';
    var list=prim.map(function(id){return R_BY[id];});
    if(sh.more){REASONS.forEach(function(r){if(prim.indexOf(r.id)<0&&(!r.t||teacher))list.push(r);});}
    var chips=list.map(function(r){return '<button type="button" class="rc" data-act="reason" data-id="'+r.id+'" aria-pressed="'+(sh.reason===r.id?'true':'false')+'">'+esc(r.label.replace(/ \(.*\)/,''))+'</button>';}).join('');
    var moreBtn=sh.more?'':'<button type="button" class="rc" data-act="more">More reasons…</button>';
    var seg=['A','E','C','L'].map(function(k){return '<button type="button" data-act="status" data-st="'+k+'" aria-pressed="'+(sh.st===k?'true':'false')+'">'+ST[k]+'</button>';}).join('');
    html='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" tabindex="-1">'+
      '<div class="grab"></div><div class="sh-head"><svg class="ic" viewBox="0 0 32 44" aria-hidden="true"><use href="#tulip"/></svg>'+
      '<div><h2 id="shT">'+esc(s.last+', '+s.short)+'</h2><p>'+esc(longDate(sh.date))+'</p></div><button type="button" class="x" data-act="close" aria-label="Close">'+XICON+'</button></div>'+
      '<fieldset class="seg" aria-label="Status"><legend class="sr">Status</legend>'+seg+'</fieldset>'+
      '<div><span class="lbl">Reason</span><div class="chips">'+chips+moreBtn+'</div></div>'+
      '<div><label class="lbl" for="note">Note (optional)</label><input type="text" id="note" maxlength="140" style="width:100%" placeholder="'+(sh.reason==='other'?'Type the reason':'e.g. fever since Sunday')+'" value="'+esc(sh.note)+'" autocomplete="off"></div>'+
      '<div class="sh-actions">'+(sh.had?'<button type="button" class="btn sec" data-act="present">Mark present</button>':'')+'<button type="button" class="btn" data-act="savecell">Save</button></div></div>';
  } else {
    html='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" tabindex="-1">'+
      '<div class="grab"></div><div class="sh-head"><svg class="ic" viewBox="0 0 32 44" aria-hidden="true"><use href="#tulip"/></svg>'+
      '<div><h2 id="shT">'+esc(longDate(sh.date))+'</h2><p>Day settings</p></div><button type="button" class="x" data-act="close" aria-label="Close">'+XICON+'</button></div>'+
      '<label class="tgl"><input type="checkbox" id="ncChk"'+(sh.noClass?' checked':'')+'> No classes (holiday, suspension, event)</label>'+
      '<div><label class="lbl" for="ncLbl">Reason for no classes</label><input type="text" id="ncLbl" maxlength="80" style="width:100%" placeholder="e.g. Undas, class suspension" value="'+esc(sh.label)+'" autocomplete="off"></div>'+
      '<label class="tgl"><input type="checkbox" id="tkChk"'+(sh.taken?' checked':'')+'> Attendance recorded (everyone not marked is present)</label>'+
      '<div class="sh-actions"><button type="button" class="btn" data-act="saveday">Save</button></div></div>';
  }
  $sheet.innerHTML=html; $sheet.hidden=false;
  var dlg=$sheet.querySelector('.sheet'); if(dlg) dlg.focus({preventScroll:true});
}

var toastT=null;
function toast(msg){$toast.textContent=msg;$toast.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){$toast.hidden=true;},2600);}

/* ---------- actions ---------- */
function setDate(d){S.date=clamp(d);render();}
function stepSchool(dir){var d=S.date;for(var i=0;i<8;i++){d=addDays(d,dir);if(d<START||d>END){return;}if(!isWeekend(d)){break;}}setDate(d);}
function exportBackup(){
  if(!dl){toast('Downloads are not available here.');return;}
  var t=new Date(), stamp=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  var data=JSON.stringify({app:'tulip-attendance',v:1,section:'Grade 11 Tulip',exported:Date.now(),days:S.days},null,1);
  dl.save({filename:'Tulip-Attendance-backup-'+stamp+'.json',data:data}).then(function(){
    try{localStorage.setItem(BACKUP_KEY,String(Date.now()));}catch(e){}
    toast('Backup file saved'); render();
  }).catch(function(){toast('Could not download the backup.');});
}
function importBackup(f){
  if(!f) return; var r=new FileReader();
  r.onerror=function(){toast('Could not read that file.');};
  r.onload=function(){
    try{
      var o=JSON.parse(r.result), inc=o&&o.days;
      if(!inc||typeof inc!=='object'||(o.app&&o.app!=='tulip-attendance')) throw new Error('bad');
      var days=Object.assign({},S.days), n=0;
      Object.keys(inc).forEach(function(k){
        var a=inc[k], b=days[k]; if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||k<START||k>END||!a||typeof a!=='object') return;
        var marks={}, am=a.marks||{};
        Object.keys(am).forEach(function(sid){var m=am[sid]; if(BY_ID[sid]&&m&&ST[m.st]) marks[sid]={st:m.st,reason:R_BY[m.reason]?m.reason:'',note:String(m.note||'').slice(0,140)};});
        var nd={date:k,taken:!!a.taken,noClass:!!a.noClass,noClassLabel:String(a.noClassLabel||'').slice(0,80),marks:marks};
        if(typeof a.takenAt==='number') nd.takenAt=a.takenAt;
        if(b){nd.marks=Object.assign({},b.marks||{},marks); nd.taken=!!(b.taken||nd.taken); nd.noClass=!!(b.noClass||nd.noClass); nd.noClassLabel=nd.noClassLabel||b.noClassLabel||''; if(nd.takenAt==null&&b.takenAt!=null) nd.takenAt=b.takenAt;}
        days[k]=nd; n++;
      });
      if(db){Object.keys(days).forEach(function(k){if(days[k]!==S.days[k]) pushDay(k,days[k]);});} S.days=days; persist(); render(); toast('Restored '+n+' day'+(n===1?'':'s'));
    }catch(e){toast('That file is not a Tulip attendance backup.');}
    document.getElementById('restoreFile').value='';
  };
  r.readAsText(f);
}
function csvEsc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCsv(){
  var p=parse(S.date), ms=monthStats(p.y,p.m), dates=ms.dates, rows=[];
  rows.push(['Section Tulip · Grade 11 · '+MONTHS[p.m-1]+' '+p.y,'','']);
  rows.push(['x = absent, E = excused (counts as absent), C = cutting classes, L = late comer (C and L count as present)']);
  rows.push(['No.','Learner','Sex'].concat(dates.map(function(d){return parse(d).d+' '+SF[dow(d)];}),['Absent','Tardy','Present','Reasons']));
  ROSTER.forEach(function(s,i){
    var why=[];
    var cells=dates.map(function(ds){
      if(!isRecorded(ds)) return '';
      var st=stOf(ds,s.id);
      if(st!=='P'){var t=reasonText(markOf(ds,s.id)); if(t) why.push(parse(ds).d+': '+t);}
      return st==='A'?'x':(st==='P'?'':st);
    });
    var q=ms.per[s.id];
    rows.push([i+1,s.full,s.sex].concat(cells,[q.abs,q.tardy,ms.days-q.abs,why.join('; ')]));
  });
  rows.push([]);
  rows.push(['','Days of classes recorded',ms.days]);
  rows.push(['','Average daily attendance',ms.ada==null?'':ms.ada.toFixed(2)]);
  rows.push(['','Percentage of attendance',ms.pct==null?'':ms.pct.toFixed(2)+'%']);
  var csv='﻿'+rows.map(function(r){return r.map(csvEsc).join(',');}).join('\r\n');
  if(!dl){toast('Download is not available here.');return;}
  dl.save({filename:'Tulip-Attendance-'+MONTHS[p.m-1]+'-'+p.y+'.csv',data:csv}).then(function(){toast('Saved');}).catch(function(e){if(e&&e.code!=='declined')toast('Could not download the file.');});
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.dataset.act, sh=S.sheet;
  switch(a){
    case 'mode': S.mode=el.dataset.mode; try{localStorage.setItem('tulip-mode',S.mode);}catch(x){} render(); break;
    case 'pick': window._stripX=document.getElementById('strip').scrollLeft; S.date=el.dataset.date; lastCentered=S.date; render(); break;
    case 'prevday': stepSchool(-1); break;
    case 'nextday': stepSchool(1); break;
    case 'today': window._stripX=null; lastCentered=''; setDate(todayStr()); break;
    case 'prevmonth': case 'nextmonth': {
      var p=parse(S.date), mm=p.m+(a==='prevmonth'?-1:1), yy=p.y; if(mm<1){mm=12;yy--;} if(mm>12){mm=1;yy++;}
      var cand=ymd(yy,mm,Math.min(p.d,dim(yy,mm))); if(cand<START||cand>END){break;} setDate(cand); break; }
    case 'open': openCell(el.dataset.sid,S.date); break;
    case 'cell': openCell(el.dataset.sid,el.dataset.date); break;
    case 'day': openDay(el.dataset.date); break;
    case 'close': closeSheet(); break;
    case 'status': sh.st=el.dataset.st; if(sh.reason&&!(PRIMARY[sh.st].indexOf(sh.reason)>=0)&&!sh.more){sh.reason='';} drawSheet(); break;
    case 'reason': sh.reason=(sh.reason===el.dataset.id)?'':el.dataset.id; drawSheet(); { var n=document.getElementById('note'); if(n&&sh.reason==='other')n.focus(); } break;
    case 'more': sh.more=true; drawSheet(); break;
    case 'savecell': {
      var nt=(document.getElementById('note').value||'').trim(), s=BY_ID[sh.sid], mk={};
      mk[sh.sid]={st:sh.st,reason:sh.reason||'',note:nt};
      writeDay(sh.date,{marks:mk}); toast(s.last+' · '+ST[sh.st]); closeSheet(); break; }
    case 'present': {
      var mk2={}; mk2[sh.sid]={st:'P',reason:'',note:''};
      writeDay(sh.date,{marks:mk2}); toast(BY_ID[sh.sid].last+' · Present'); closeSheet(); break; }
    case 'saveday': {
      var nc=document.getElementById('ncChk').checked, lb=(document.getElementById('ncLbl').value||'').trim(), tk=document.getElementById('tkChk').checked;
      var patch={noClass:nc,noClassLabel:lb,taken:tk}; if(tk&&!sh.taken)patch.takenAt=Date.now();
      writeDay(sh.date,patch); toast('Day saved'); closeSheet(); break; }
    case 'take': writeDay(S.date,{taken:true,takenAt:Date.now()}); toast('Attendance saved'); break;
    case 'untake': writeDay(S.date,{taken:false}); break;
    case 'csv': exportCsv(); break;
    case 'backup': exportBackup(); break;
    case 'restore': document.getElementById('restoreFile').click(); break;
    case 'sf2': openSf2(); break;
    case 'sf2close': closeSf2(); break;
    case 'sf2dl': sf2Download(); break;
  }
});
document.addEventListener('input',function(e){
  if(!S.sheet) return;
  if(e.target.id==='note') S.sheet.note=e.target.value;
});
document.addEventListener('change',function(e){
  if(e.target.id==='restoreFile'){importBackup(e.target.files&&e.target.files[0]);return;}
  if(e.target.id==='monthSel'){
    var v=e.target.value.split('-'), y=+v[0], m=+v[1], p=parse(S.date);
    window._stripX=null; lastCentered=''; setDate(ymd(y,m,Math.min(p.d,dim(y,m))));
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(sf2State)closeSf2();else if(S.sheet)closeSheet();}});

function sfTxt(t){return esc(t).replace(/\n/g,'<br>');}
function sfTrim(v){return String(+v.toFixed(2));}
function sfPct(v){return v.toFixed(1)+'%';}

function sf2Remarks(s,dates,idx){
  var groups=[];
  dates.forEach(function(ds){
    if(!isRecorded(ds)) return;
    var mk=markOf(ds,s.id), st=mk&&mk.st?mk.st:'P'; if(st==='P') return;
    var why=reasonText(mk), lab;
    if(st==='A') lab=why||'Absent';
    else if(st==='E') lab='Excused'+(why?' - '+why:'');
    else lab=ST[st]+(why?' - '+why:'');
    var d=parse(ds).d, last=groups[groups.length-1];
    if(last&&last.lab===lab&&idx[ds]===last.i+1){last.to=d;last.i=idx[ds];}
    else groups.push({from:d,to:d,lab:lab,i:idx[ds]});
  });
  return groups.map(function(g){return (g.from===g.to?g.from:g.from+'-'+g.to)+' '+g.lab;}).join('; ');
}

function sf2Doc(y,m){
  var ms=monthStats(y,m);
  var dates=ms.dates.filter(function(ds){return dow(ds)!==0||isRecorded(ds);});
  var nC=dates.length, nDays=ms.days, idx={}, k=0;
  dates.forEach(function(ds){if(isRecorded(ds)){idx[ds]=k++;}});
  var month=MONTHS[m-1].toUpperCase();
  var sy=m>=6?(y+'-'+(y+1)):((y-1)+'-'+y);
  var term=(m>=9&&m<=11)?'SECOND TERM':'';
  function isNc(ds){var d=dayDoc(ds);return !!(d&&d.noClass);}

  /* register */
  var head='<tr><th rowspan="3">No.</th><th rowspan="3" class="nmh"><b>NAME</b><br>(Last Name, First Name, Middle Name)</th>'+
    '<th class="hl" colspan="'+nC+'">DATE</th><th colspan="2" rowspan="2">Total for the<br>Month</th>'+
    '<th rowspan="3" class="remh">REMARKS (If NLPA, state reason, please refer to legend number 2. If TRANSFERRED IN/OUT, write the name of School.)</th></tr>'+
    '<tr>'+dates.map(function(ds){return '<th class="d'+(isNc(ds)?' nc':'')+'">'+parse(ds).d+'</th>';}).join('')+'</tr>'+
    '<tr>'+dates.map(function(ds){return '<th class="w'+(isNc(ds)?' nc':'')+'">'+SF[dow(ds)]+'</th>';}).join('')+'<th>ABSENT</th><th>PRESENT</th></tr>';

  function rowsFor(list){
    return list.map(function(s,i){
      var cells=dates.map(function(ds){
        if(isNc(ds)) return '<td class="nc"></td>';
        if(!isRecorded(ds)) return '<td></td>';
        var st=stOf(ds,s.id);
        if(st==='A'||st==='E') return '<td class="x">x</td>';
        if(st==='C') return '<td class="cut"></td>';
        if(st==='L') return '<td class="late"></td>';
        return '<td></td>';
      }).join('');
      var q=ms.per[s.id];
      return '<tr><td class="no">'+(i+1)+'</td><td class="nm">'+esc(PRINT_NAME[s.id]||s.full)+'</td>'+cells+
        '<td class="tt">'+(nDays?q.abs:'')+'</td><td class="tt">'+(nDays?nDays-q.abs:'')+'</td>'+
        '<td class="rem"><div>'+esc(sf2Remarks(s,dates,idx))+'</div></td></tr>';
    }).join('');
  }
  var sumM=0,sumF=0,absM=0,absF=0;
  dates.forEach(function(ds){var pd=ms.perDay[ds]; if(pd){sumM+=pd.M;sumF+=pd.F;}});
  MALES.forEach(function(s){absM+=ms.per[s.id].abs;}); FEMALES.forEach(function(s){absF+=ms.per[s.id].abs;});
  function totRow(label,key){
    var cells=dates.map(function(ds){
      if(isNc(ds)) return '<td class="nc"></td>';
      var pd=ms.perDay[ds]; if(!pd) return '<td></td>';
      return '<td class="tn">'+(key==='T'?pd.M+pd.F:pd[key])+'</td>';
    }).join('');
    var a=key==='M'?absM:(key==='F'?absF:absM+absF), p=key==='M'?sumM:(key==='F'?sumF:sumM+sumF);
    return '<tr class="tot"><td></td><td class="lb">'+label+'</td>'+cells+'<td class="tt">'+(nDays?a:'')+'</td><td class="tt">'+(nDays?p:'')+'</td><td></td></tr>';
  }
  var body=rowsFor(MALES)+totRow('&#8656;== MALE | TOTAL Per Day ==&#8658;','M')+rowsFor(FEMALES)+totRow('&#8656;== FEMALE | TOTAL Per Day ==&#8658;','F')+totRow('Combined TOTAL Per Day','T');
  var colgroup='<colgroup><col class="no"><col class="nm">'+dates.map(function(){return '<col>';}).join('')+'<col class="tt"><col class="tt"><col class="rem"></colgroup>';

  var top='<div class="hd"><img class="seal" src="'+LOGO_SEAL+'" alt=""><h1>School Form 2 Daily Attendance Report of Learners For Senior High School (SF2-SHS)</h1><img class="deped" src="'+LOGO_DEPED+'" alt="DepEd"></div>'+
    '<div class="fr"><span class="f g" style="flex:1.7"><span>School Name</span><span class="b">'+esc(SCHOOL.name)+'</span></span>'+
      '<span class="f g"><span>School ID</span><span class="b">'+SCHOOL.id+'</span></span>'+
      '<span class="f g"><span>District</span><span class="b">'+SCHOOL.district+'</span></span>'+
      '<span class="f g"><span>Division</span><span class="b">'+SCHOOL.division+'</span></span>'+
      '<span class="f g"><span>Region</span><span class="b">'+SCHOOL.region+'</span></span></div>'+
    '<div class="fr"><span class="f g"><span>Semester</span><span class="b ed" contenteditable="true">'+term+'</span></span>'+
      '<span class="f g"><span>School Year</span><span class="b">'+sy+'</span></span>'+
      '<span class="f g"><span>Grade Level</span><span class="b">'+SCHOOL.grade+'</span></span>'+
      '<span class="f g" style="flex:2.2"><span>Track and Strand</span><span class="b">'+esc(SCHOOL.track)+'</span></span></div>'+
    '<div class="fr r3"><span class="f" style="width:230px"><span>Section</span><span class="b">'+SCHOOL.section+'</span></span>'+
      '<span class="f g"><span>Course (for TVL only)</span><span class="b"></span></span>'+
      '<span class="f" style="width:300px"><span>Month of</span><span class="b">'+month+'</span></span></div>'+
    '<div class="tool"><span class="f"><span class="tl">Learner Attendance Conversion Tool</span><span class="tb"></span></span></div>';

  var page1='<section class="page">'+top+'<table class="reg">'+colgroup+'<thead>'+head+'</thead><tbody>'+body+'</tbody></table></section>';

  /* summary */
  var nM=MALES.length,nF=FEMALES.length,nT=ROSTER.length;
  function ada(sum,n){return nDays?sum/nDays:null;}
  var aM=ada(sumM),aF=ada(sumF),aT=nDays?(sumM+sumF)/nDays:null;
  function fmtA(v){return v==null?'':sfTrim(v);}
  function fmtP(v,n){return v==null?'':sfPct(v/n*100);}
  var c5M=MALES.filter(function(s){return ms.per[s.id].maxRun>=5;}).length, c5F=FEMALES.filter(function(s){return ms.per[s.id].maxRun>=5;}).length;
  function ed(v){return '<td class="big ed" contenteditable="true">'+v+'</td>';}
  function vals(a,b,c){return '<td class="big">'+a+'</td><td class="big">'+b+'</td><td class="big">'+c+'</td>';}
  function lab(t,sub){return '<td class="l'+(sub?' sub':'')+'" colspan="2">'+t+'</td>';}
  var sm='<table class="sm"><colgroup><col class="c1"><col class="c2"><col class="cv"><col class="cv"><col class="cv"></colgroup>'+
    '<tr><td class="l" style="font-size:8px">Month : '+month+'</td><td class="l" style="font-size:7.5px">No. of Days of Classes: &nbsp;<b>'+(nDays||'')+'</b></td><td class="hh" colspan="3">Summary</td></tr>'+
    '<tr><td colspan="2"></td><td class="hh">M</td><td class="hh">F</td><td class="hh">TOTAL</td></tr>'+
    '<tr>'+lab('* Enrolment as of (1st Friday of class started)')+vals(nM,nF,nT)+'</tr>'+
    '<tr>'+lab('Late enrolment <b>during the month</b><br>(beyond cut-off)')+ed(0)+ed(0)+ed(0)+'</tr>'+
    '<tr>'+lab('Registered Learners as of<br><b>end of month</b>')+vals(nM,nF,nT)+'</tr>'+
    '<tr>'+lab('Percentage of Enrolment as of<br>end of month')+vals('100%','100%','100%')+'</tr>'+
    '<tr>'+lab('Average Daily Attendance')+vals(fmtA(aM),fmtA(aF),fmtA(aT))+'</tr>'+
    '<tr>'+lab('Percentage of Attendance for the month')+vals(fmtP(aM,nM),fmtP(aF,nF),fmtP(aT,nT))+'</tr>'+
    '<tr>'+lab('Number of students absent for 5 consecutive days')+vals(c5M,c5F,c5M+c5F)+'</tr>'+
    '<tr class="band"><td colspan="5"></td></tr>'+
    '<tr>'+lab('NLPA',1)+ed(0)+ed(0)+ed(0)+'</tr>'+
    '<tr>'+lab('Transferred Out',1)+ed(0)+ed(0)+ed(0)+'</tr>'+
    '<tr>'+lab('Transferred In',1)+ed(0)+ed(0)+ed(0)+'</tr>'+
    '<tr>'+lab('Shifted Out',1)+ed(0)+ed(0)+ed(0)+'</tr>'+
    '<tr>'+lab('Shifted In',1)+ed(0)+ed(0)+ed(0)+'</tr></table>';

  var cert='<div class="cert"><div class="ct">I certify that this is a true and correct report.</div>'+
    '<div class="sig"><div class="nmn">'+SCHOOL.adviser+'</div><div class="cp">(Signature of Adviser over Printed Name)</div></div>'+
    '<div class="sig" style="margin-top:22px"><div class="nmn">'+SCHOOL.head+'</div><div class="cp">(Signature of School Head over Printed Name)</div></div></div>';

  var left='<div class="nt"><p>1. The attendance shall be accomplished daily. Refer to the codes for checking learners\' attendance.<br>2. Dates shall be written in the columns after Learner\'s Name.<br>3. To compute the following:</p>'+
    '<div class="fm"><span class="fl">a. Percentage of Enrolment =</span><span class="fx"><span class="n">Registered Learners as of end of the month</span><span class="dn">Enrolment as of 1st Friday of the school year</span></span><span>x 100</span></div>'+
    '<div class="fm"><span class="fl">b. Average Daily Attendance =</span><span class="fx"><span class="n">Total Daily Attendance</span><span class="dn">Number of School Days in reporting month</span></span><span></span></div>'+
    '<div class="fm"><span class="fl">c. Percentage of Attendance for the month =</span><span class="fx"><span class="n">Average daily attendance</span><span class="dn">Registered Learners as of end of the month</span></span><span>x 100</span></div>'+
    '<p>4. Every end of the month, the class adviser will submit this form to the office of the principal for recording of summary table into School Form 4. Once signed by the principal, this form should be returned to the adviser.<br>'+
    '5. The adviser will provide necessary interventions including but not limited to home visitation to learner/s who were absent for 5 consecutive days and/or those at risk of dropping out.<br>'+
    '6. Attendance performance of learners will be reflected in Form 137 and Form 138 every grading period.</p></div>';
  var mid='<div><div class="cd"><h4>1. CODES FOR CHECKING ATTENDANCE</h4><p>(blank) - Present; (x)- Absent; Tardy (half shaded= Upper for Late Comer, Lower for Cutting Classes)</p>'+
    '<h4>2. REASONS/CAUSES FOR NLPA</h4>'+
    '<div class="gp">a. Domestic-Related Factors</div><div class="it">a.1. Had to take care of siblings<br>a.2. Early marriage/pregnancy<br>a.3. Parents\' attitude toward schooling<br>a.4. Family problems</div>'+
    '<div class="gp">b. Individual-Related Factors</div><div class="it">b.1. Illness<br>b.2. Overage<br>b.3. Death<br>b.4. Drug Abuse<br>b.5. Poor academic performance<br>b.6. Lack of interest/Distractions<br>b.7. Hunger/Malnutrition</div>'+
    '<div class="gp">c. School-Related Factors</div><div class="it">c.1. Teacher Factor<br>c.2. Physical condition of classroom<br>c.3. Peer influence</div>'+
    '<div class="gp">d. Geographic/Environmental</div><div class="it">d.1. Distance between home and school<br>d.2. Armed conflict (incl. Tribal wars &amp; clanfeuds)<br>d.3. Calamities/Disasters</div>'+
    '<div class="gp">e. Financial-Related</div><div class="it">e.1. Child labor, work</div>'+
    '<div class="gp">f. Others (Specify)</div></div><div class="lis">Generated thru LIS</div></div>';
  var page2='<section class="page"><div class="bt">'+left+mid+'<div>'+sm+cert+'</div></div></section>';

  var tip='<div class="tip">SF2 for <b>'+MONTHS[m-1]+' '+y+'</b>, Grade 11 TULIP. To print: press <b>Ctrl+P</b> (Mac: <b>Cmd+P</b>), choose paper <b>A4</b>, <b>Landscape</b>, scale <b>100%</b>, then print or save as PDF. This bar and the yellow boxes do not print.</div>';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SF2 '+MONTHS[m-1]+' '+y+' - Tulip</title><style>'+SF2_CSS+'</style></head><body>'+tip+page1+page2+'</body></html>';
}

/* preview + download */
var $sf2=document.createElement('div'); $sf2.id='sf2Root'; $sf2.hidden=true; document.body.appendChild($sf2);
var sf2State=null;
function openSf2(){
  var p=parse(S.date), html=sf2Doc(p.y,p.m);
  sf2State={y:p.y,m:p.m,html:html};
  $sf2.innerHTML='<div class="sf2bar"><button type="button" class="btn sec" data-act="sf2close">Back</button>'+
    '<div class="sf2t"><strong>SF2 · '+MONTHS[p.m-1]+' '+p.y+'</strong><span>Yellow boxes can be typed in before you download.</span></div>'+
    (dl?'<button type="button" class="btn" data-act="sf2dl">Download SF2</button>':'<span class="foot" style="margin:0">Downloads are not available in this view.</span>')+'</div>'+
    '<iframe id="sf2Frame" title="SF2 preview"></iframe>';
  $sf2.hidden=false; document.documentElement.style.overflow='hidden';
  document.getElementById('sf2Frame').srcdoc=html;
}
function closeSf2(){sf2State=null;$sf2.hidden=true;$sf2.innerHTML='';document.documentElement.style.overflow='';}
function sf2Download(){
  if(!dl||!sf2State){toast('Download is not available here.');return;}
  var html=sf2State.html;
  try{var fr=document.getElementById('sf2Frame'); html='<!doctype html>\n'+fr.contentDocument.documentElement.outerHTML;}catch(e){}
  html=html.replace(/ contenteditable="true"/g,'');
  dl.save({filename:'SF2-Tulip-'+MONTHS[sf2State.m-1]+'-'+sf2State.y+'.html',data:html}).then(function(){toast('SF2 saved. Open it and press Ctrl+P to print.');}).catch(function(e){if(e&&e.code!=='declined')toast('Could not download the file.');});
}


/* ---------- boot ---------- */
render();
(function boot(){
  S.days=loadStore(); S.loading=false;
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
  render();
  if(!(window.claude&&window.claude.use)) return;
  claude.use('downloads').then(function(d){ if(d){dl=d;} else {dl=null;S.canDownload=false;} render(); }).catch(function(){});
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
    var d=r[0],u=r[1]; if(!d) return;
    db=d; S.loading=true; S.days={}; render();
    return Promise.resolve(u&&u.can?u.can('data.write'):null).then(function(ok){
      if(ok===false) S.canWrite=false;
      db.collection('days').onSnapshot(function(snap){
        var o={}; snap.docs.forEach(function(x){o[x.id]=x.data();});
        S.days=o; S.loading=false; softRender();
      },function(e){console.error(e); S.loading=false; toast('Lost the live connection. Reload the page.'); render();});
    });
  }).catch(function(e){console.error(e);});
})();
})();
